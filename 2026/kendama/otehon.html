<style>
:root {
  --sky: #3BB4E8;
  --ground: #3BB4E8;
  --ground-2: #8ED6F6;
  --soft: #EAF6FD;
  --card: #FFFFFF;
  --ink: #1D2B53;
  --muted: #2E3C63;
  --red: #E2352B;
  --orange: #FF8A1F;
  --yellow: #FFE14D;
  --green: #22A04B;
  --blue: #1E6FD9;
  --line: #C9DDEB;
  --font-display: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  color-scheme: light;
  --font-body: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
}
* { box-sizing: border-box; }
body {
  background: linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 100%) fixed; background-color: var(--ground); color: var(--ink);
  font-family: var(--font-body); font-weight: 500; font-size: 16px; line-height: 1.75;
}
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--blue); }
a:focus-visible, .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

/* header */
.hero { background: transparent; color: #1D2B53; position: relative; z-index: 1; }
.hero .wrap { padding-block: 20px 28px; display: grid; gap: 14px; text-align: center; }
.host { justify-self: center; background: var(--green); border: 3px solid #FFFFFF; border-radius: 999px; padding: 2px 16px; font-weight: 800; font-size: 14px; }
.hero h1 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 7vw, 40px); line-height: 1.3; text-wrap: balance; color: #1D2B53; -webkit-text-stroke: 6px #FFFFFF; paint-order: stroke fill; letter-spacing: 0.02em; }
.hero h1 .sub { display: block; }
.catch { margin: 0; font-weight: 800; font-size: 17px; color: #1D2B53; }
.poster { display: block; width: 100%; height: auto; max-width: 100%; margin: 0 auto; border-radius: 14px; border: 4px solid #FFFFFF; box-shadow: 0 6px 0 rgba(0,0,0,0.18); }

/* sections */
main .wrap { padding-block: 24px 40px; display: grid; gap: 20px; }
main, footer { position: relative; z-index: 1; }
section { background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 22px 20px; min-width: 0; box-shadow: 0 6px 0 rgba(29,43,83,0.25); }
h2 { margin: 0 0 14px; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.4; display: flex; align-items: center; gap: 10px; text-wrap: balance; }
h2::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px var(--ink); flex: none; }
h3 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.4; }
p { margin: 0; }


.lead { margin-bottom: 14px; }
.player { position: sticky; top: 8px; z-index: 3; padding: 12px; }
.player .now { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.player .now b { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--red); line-height: 1.3; }
.video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #0b1530; }
.video video { position: absolute; inset: 0; width: 100%; height: 100%; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { font: inherit; font-weight: 800; font-size: 14px; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
.group + .group { margin-top: 22px; }
.group h3 { margin-bottom: 10px; }
.tricks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.trick { width: 100%; min-height: 56px; padding: 8px 10px; font: inherit; font-weight: 800; font-size: 16px; line-height: 1.35;
  color: var(--ink); background: var(--soft); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.trick:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.trick[aria-current="true"] { background: var(--yellow); }
.trick:focus-visible, .chip:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
@media (min-width: 560px) { .tricks { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
footer { background: var(--orange); color: #1D2B53; position: relative; z-index: 1; }
footer .wrap { padding-block: 20px; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; font-size: 14px; }
footer img { width: 44px; height: 44px; max-width: none; object-fit: contain; }
main { position: relative; z-index: 1; }
/* confetti */
.confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.confetti i { position: absolute; top: -24px; display: block; width: 10px; height: 16px; border-radius: 2px; opacity: 0.9;
  animation: fall linear infinite; }
@keyframes fall {
  0% { transform: translate3d(0, -24px, 0) rotate(0deg); }
  25% { transform: translate3d(14px, 25vh, 0) rotate(160deg); }
  50% { transform: translate3d(-10px, 50vh, 0) rotate(320deg); }
  75% { transform: translate3d(12px, 75vh, 0) rotate(480deg); }
  100% { transform: translate3d(0, 105vh, 0) rotate(640deg); }
}
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

<script>
(function () {
  var box = document.querySelector('.confetti');
  if (!box || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var colors = ['#E2352B','#FF8A1F','#FFE14D','#22A04B','#1E6FD9','#FFFFFF'];
  var n = innerWidth < 560 ? 14 : 26;
  for (var i = 0; i < n; i++) {
    var c = document.createElement('i');
    c.style.left = (Math.random() * 100) + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (9 + Math.random() * 9) + 's';
    c.style.animationDelay = (-Math.random() * 18) + 's';
    box.appendChild(c);
  }
})();

(function () {
  var v = document.getElementById('v');
  var now = document.getElementById('now');
  var loopBtn = document.getElementById('loop');
  var slowBtn = document.getElementById('slow');
  var btns = [].slice.call(document.querySelectorAll('.trick'));
  var cur = btns[0], s = +cur.dataset.s, e = +cur.dataset.e;

  function select(b, play) {
    btns.forEach(function (x) { x.removeAttribute('aria-current'); });
    b.setAttribute('aria-current', 'true');
    cur = b; s = +b.dataset.s; e = +b.dataset.e;
    now.textContent = b.textContent;
    var go = function () { v.currentTime = s; if (play) v.play(); };
    if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, { once: true });
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      select(b, true);
    });
  });
  v.addEventListener('timeupdate', function () {
    if (v.currentTime >= e || v.currentTime < s - 0.5) {
      if (loopBtn.getAttribute('aria-pressed') === 'true' && !v.paused) { v.currentTime = s; }
      else { v.pause(); v.currentTime = s; }
    }
  });
  loopBtn.addEventListener('click', function () {
    loopBtn.setAttribute('aria-pressed', loopBtn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  });
  slowBtn.addEventListener('click', function () {
    var on = slowBtn.getAttribute('aria-pressed') !== 'true';
    slowBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    v.playbackRate = on ? 0.5 : 1;
  });
  v.addEventListener('play', function () { v.playbackRate = slowBtn.getAttribute('aria-pressed') === 'true' ? 0.5 : 1; });
  select(cur, false);
})();
</script>
