<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おやじのけん玉大会2026 予約サイト</title>
<style>
:root{
  --sky1:#5cc8fb;--sky2:#c9efff;--ink:#12335f;--card:rgba(255,255,255,.88);
  --blue:#1e78e6;--orange:#ff8a00;--green:#2fae3f;--purple:#8a63e0;--red:#ee3124;--yellow:#ffd91a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;color:var(--ink);line-height:1.8;
  background:linear-gradient(180deg,var(--sky1) 0%,#8fdcff 55%,var(--sky2) 100%);background-attachment:fixed;min-height:100vh;position:relative}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(255,255,255,.9)}}
.bunting{position:absolute;top:0;left:0;width:100%;height:56px;z-index:2;pointer-events:none}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg span{position:absolute;display:block;font-size:clamp(40px,7vw,84px);opacity:.5;animation:drift 16s ease-in-out infinite alternate}
.bg .c{position:absolute;width:12px;height:20px;border-radius:2px;animation:fall linear infinite;opacity:.85}
@keyframes drift{from{transform:translateY(0) rotate(-12deg)}to{transform:translateY(-34px) rotate(12deg)}}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
.cloud{position:absolute;bottom:-30px;width:60%;height:120px;background:#fff;border-radius:60px;opacity:.9;box-shadow:80px -30px 0 20px #fff,200px -10px 0 0 #fff}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:16px 16px 40px}
.poster{display:block;width:100%;height:auto;border-radius:24px;border:6px solid #fff;box-shadow:0 10px 30px rgba(18,51,95,.25)}
h1{margin:22px 0 6px;text-align:center;font-size:clamp(24px,6vw,42px);line-height:1.35;font-weight:900;color:#fff;
  -webkit-text-stroke:0;text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),0 0 14px rgba(18,51,95,.4)}
.lead{text-align:center;margin:0 0 22px;font-weight:700}
.card{background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:26px;padding:22px 20px;margin:0 0 18px;border:3px solid #fff;box-shadow:0 6px 18px rgba(18,51,95,.15)}
.card h2{margin:0 0 12px;font-size:clamp(19px,4.5vw,25px);display:flex;align-items:center;gap:10px}
.card h2::before{content:"";flex:none;width:14px;height:28px;border-radius:7px;background:var(--c,var(--blue))}
.c-o{--c:var(--orange)}.c-g{--c:var(--green)}.c-p{--c:var(--purple)}.c-b{--c:var(--blue)}
dl{margin:0;display:grid;grid-template-columns:7em 1fr;gap:10px 12px}
dt{font-weight:900;color:#fff;background:var(--blue);border-radius:999px;text-align:center;padding:2px 8px;align-self:start}
dt.o{background:var(--orange)}dt.g{background:var(--green)}
dd{margin:0;overflow-wrap:anywhere}
.card p,.card li{overflow-wrap:anywhere}
.card ul{margin:0;padding-left:1.3em}
.ph{color:#5b6f8c}
.btns{display:grid;gap:12px;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:12px 18px;border-radius:999px;color:#fff;font-weight:900;font-size:18px;text-decoration:none;text-align:center;
  background:var(--b);box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 rgba(0,0,0,.22)}
.btn:focus-visible,a:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.b-o{--b:var(--orange)}.b-b{--b:var(--blue)}.b-g{--b:var(--green)}.b-p{--b:var(--purple)}
.reserve{text-align:center}
.reserve .btn{font-size:clamp(20px,5vw,26px);min-height:68px}
footer{text-align:center;font-size:13px;font-weight:700;padding:8px 0 4px}
@media (min-width:720px){.btns.two{grid-template-columns:1fr 1fr}main{padding-top:24px}.card{padding:28px 30px}}
@media (max-width:420px){dl{grid-template-columns:1fr;gap:4px}dt{justify-self:start;margin-top:8px}}
@media (prefers-reduced-motion:reduce){.bg span,.bg .c{animation:none}}
</style>
</head>
