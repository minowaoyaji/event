<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f8fbff">
<title>オールみのわフェスタ チアゲーム</title>
<style>
:root{
  --navy:#102d70;
  --blue:#2457c5;
  --red:#e52b42;
  --pink:#ff5f86;
  --white:#fff;
  --ink:#172044;
  --gold:#ffd84d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color:var(--ink);background:#f8fbff;
}
body{touch-action:manipulation}
button{
  font:inherit;border:0;cursor:pointer;user-select:none;
}
#app{
  width:100%;height:100dvh;min-height:520px;overflow:hidden;
  position:relative;background:
    radial-gradient(circle at 12% 12%,rgba(229,43,66,.12) 0 5px,transparent 6px),
    radial-gradient(circle at 88% 18%,rgba(36,87,197,.13) 0 6px,transparent 7px),
    linear-gradient(180deg,#fff 0%,#f5f9ff 100%);
}
#app:before,#app:after{
  content:"";position:absolute;pointer-events:none;z-index:0;
  width:150px;height:150px;border-radius:50%;
  border:12px dotted rgba(229,43,66,.11);
}
#app:before{left:-90px;top:18%}
#app:after{right:-90px;bottom:8%;border-color:rgba(36,87,197,.11)}

.screen{
  position:absolute;inset:0;z-index:1;
  display:none;flex-direction:column;align-items:center;
  padding:clamp(10px,2.2vh,22px) clamp(10px,3vw,24px);
}
.screen.active{display:flex}

#titleScreen{justify-content:flex-start;padding-top:clamp(5px,1.2vh,12px);padding-bottom:clamp(5px,1vh,10px)}
.logo{
  text-align:center;line-height:.98;margin-top:clamp(0px,1vh,8px);
  filter:drop-shadow(0 3px 0 rgba(16,45,112,.12));
}
.logo .small{
  display:block;font-size:clamp(16px,3.2vh,28px);font-weight:900;
  color:var(--red);letter-spacing:.16em;
}
.logo .main{
  display:block;font-size:clamp(34px,8.5vw,66px);font-weight:1000;
  color:var(--navy);letter-spacing:.03em;
}
.logo .sub{
  display:block;font-size:clamp(26px,6.8vw,50px);font-weight:1000;
  color:var(--red);margin-top:2px;
}
.catch{
  margin-top:clamp(5px,1.2vh,12px);
  color:#3e4d76;font-weight:900;font-size:clamp(13px,2.2vh,18px);
}
.titleChars{
  width:min(760px,100%);height:clamp(150px,29vh,250px);
  display:flex;align-items:flex-end;justify-content:space-around;
  margin-top:clamp(0px,.5vh,5px);
  position:relative;
}
.titleChar{
  width:24%;height:100%;display:flex;align-items:flex-end;justify-content:center;
}
.idleWrap{
  width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;
  animation:idle 1.6s ease-in-out infinite;
}
.titleChar img{
  max-width:100%;max-height:92%;width:auto;height:auto;object-fit:contain;
  transform-origin:50% 100%;
}
.titleChar:nth-child(2) .idleWrap{animation-delay:-.35s}
.titleChar:nth-child(3) .idleWrap{animation-delay:-.7s}
.titleChar:nth-child(4) .idleWrap{animation-delay:-1.05s}
@keyframes idle{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  25%{transform:translateY(-5px) rotate(1.5deg)}
  50%{transform:translateY(-9px) rotate(-1deg)}
  75%{transform:translateY(-3px) rotate(1.5deg)}
}
.menu{
  width:min(520px,100%);display:grid;gap:clamp(5px,1vh,9px);
  margin-top:clamp(2px,1vh,8px);margin-bottom:0;
}
.diff{
  min-height:clamp(42px,6.4vh,58px);border-radius:16px;
  color:white;font-size:clamp(18px,4.8vw,27px);font-weight:1000;
  box-shadow:0 6px 0 rgba(16,45,112,.18),0 10px 22px rgba(16,45,112,.10);
  border:3px solid rgba(255,255,255,.85);
  transition:transform .08s;
}
.diff:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(16,45,112,.18)}
.easy{background:linear-gradient(135deg,#2d77d9,#2457c5)}
.normal{background:linear-gradient(135deg,#e94b60,#d5233c)}
.hard{background:linear-gradient(135deg,#102d70,#17265b)}
.diff span{font-size:.62em;display:block;opacity:.9;margin-top:-2px}

#gameScreen{padding:0;touch-action:none}
.gameTop{
  width:100%;height:clamp(54px,9vh,72px);display:flex;align-items:center;
  justify-content:space-between;padding:8px 12px;z-index:5;
}
.badge{
  background:white;border:3px solid var(--navy);border-radius:16px;
  padding:5px 10px;font-size:clamp(13px,3.4vw,18px);font-weight:1000;
  box-shadow:0 4px 0 rgba(16,45,112,.13);
}
#scoreBadge{color:var(--navy)}
#roundBadge{color:var(--red)}
.instruction{
  position:absolute;top:clamp(58px,9vh,75px);left:50%;transform:translateX(-50%);
  white-space:nowrap;z-index:4;background:rgba(255,255,255,.88);
  border-radius:999px;padding:5px 13px;font-weight:1000;
  font-size:clamp(13px,3.4vw,18px);color:var(--navy);
  box-shadow:0 3px 12px rgba(16,45,112,.08);
}
.stage{
  position:absolute;left:0;right:0;top:clamp(76px,12vh,94px);bottom:0;
  overflow:hidden;touch-action:none;
}
.stage:before{
  content:"";position:absolute;left:5%;right:5%;bottom:18%;
  height:5px;border-radius:50%;background:rgba(16,45,112,.12);
  box-shadow:0 8px 20px rgba(16,45,112,.09);
}
.charSlot{
  position:absolute;bottom:18%;width:25%;height:52%;
  display:flex;align-items:flex-end;justify-content:center;
  will-change:transform;
}
.charScale{
  width:100%;height:100%;
  display:flex;align-items:flex-end;justify-content:center;
  transform-origin:50% 100%;
}
.charSlot img{
  max-width:96%;max-height:100%;width:auto;height:auto;object-fit:contain;
  transform-origin:50% 100%;user-select:none;pointer-events:none;
  filter:drop-shadow(0 5px 2px rgba(16,45,112,.07));
}
.slot0{left:0}.slot1{left:25%}.slot2{left:50%}.slot3{left:75%}

.tapPulse{
  position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) scale(.6);
  opacity:0;pointer-events:none;z-index:8;border-radius:50%;
  width:90px;height:90px;border:5px solid rgba(229,43,66,.45);
}
.tapPulse.show{animation:pulse .45s ease-out}
@keyframes pulse{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}
}
.judge{
  position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.7);
  opacity:0;z-index:20;pointer-events:none;text-align:center;
  font-weight:1000;font-size:clamp(22px,7vw,42px);line-height:.9;
  color:var(--navy);text-shadow:0 3px 0 white,0 6px 14px rgba(16,45,112,.2);
  white-space:nowrap;
}
.judge.show{animation:judgeIn .65s cubic-bezier(.2,1.5,.35,1) both}
.judge.perfect{color:#e31f45;font-size:clamp(28px,8.5vw,54px)}
@keyframes judgeIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(-7deg)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-1deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}
}
.particle{
  position:absolute;z-index:19;pointer-events:none;width:10px;height:18px;
  border-radius:3px;background:var(--red);
  left:50%;top:42%;opacity:1;
}
.particle.blue{background:var(--blue)}
.particle.gold{background:var(--gold)}
@keyframes confetti{
  0%{transform:translate(0,0) rotate(0);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}
}

#resultScreen{justify-content:center;text-align:center;padding-top:clamp(8px,2vh,18px);padding-bottom:clamp(8px,2vh,18px)}
.resultTitle{
  font-size:clamp(30px,8vw,54px);font-weight:1000;color:var(--navy);
  margin-bottom:2px;
}
.totalLabel{font-size:clamp(18px,4.5vw,25px);font-weight:1000;color:var(--red)}
.totalScore{
  font-size:clamp(48px,14vw,86px);line-height:1;color:var(--navy);
  font-weight:1000;margin:3px 0 7px;
  text-shadow:0 5px 0 rgba(36,87,197,.10);
}
.rank{
  font-size:clamp(25px,7vw,42px);font-weight:1000;color:var(--red);
  margin:4px 0 16px;
}
.stats{
  width:min(390px,92vw);background:white;border-radius:20px;padding:10px 15px;
  box-shadow:0 7px 22px rgba(16,45,112,.10);border:2px solid #e8eef9;
}
.stat{
  display:flex;justify-content:space-between;align-items:center;
  font-size:clamp(16px,4vw,21px);font-weight:1000;padding:4px 2px;
}
.stat b{color:var(--navy)}
.resultButtons{width:min(420px,92vw);display:grid;gap:9px;margin-top:14px}
.resultBtn{
  min-height:44px;border-radius:15px;font-size:18px;font-weight:1000;
  color:white;background:var(--red);box-shadow:0 5px 0 #b8192e;
}
.resultBtn.secondary{background:var(--navy);box-shadow:0 5px 0 #071a49}
.resultBtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}

.spark{
  position:absolute;width:7px;height:7px;background:white;z-index:2;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:spark 1.4s ease-in-out infinite;
}
@keyframes spark{0%,100%{transform:scale(.6) rotate(0);opacity:.35}50%{transform:scale(1.4) rotate(45deg);opacity:1}}

@media (max-height:650px){
  .logo .small{font-size:13px}.logo .main{font-size:34px}.logo .sub{font-size:27px}
  .titleChars{height:175px}.catch{font-size:12px}
  .diff{min-height:43px}.menu{gap:6px}
}

@media (max-height:720px){
  .logo .small{font-size:14px}
  .logo .main{font-size:clamp(30px,7.8vw,48px)}
  .logo .sub{font-size:clamp(22px,5.8vw,38px)}
  .catch{font-size:12px;margin-top:2px}
  .titleChars{height:24vh;min-height:125px;max-height:185px}
  .diff{min-height:40px}
  .diff span{font-size:.55em}
  .menu{gap:5px}
}
@media (max-height:600px){
  .logo .small{font-size:12px}
  .logo .main{font-size:30px}
  .logo .sub{font-size:22px}
  .titleChars{height:22vh;min-height:105px;max-height:145px}
  .catch{display:none}
  .diff{min-height:36px;font-size:17px}
}
@media (max-width:380px){
  .titleChar img{max-width:92%}
  .gameTop{padding-left:8px;padding-right:8px}
  .instruction{font-size:12px;padding:4px 10px}
}
</style>
</head>
<body>
<div id="app">
  <div class="spark" style="left:8%;top:10%"></div>
  <div class="spark" style="left:91%;top:34%;animation-delay:.4s"></div>
  <div class="spark" style="left:13%;bottom:18%;animation-delay:.8s"></div>
  <div class="spark" style="right:10%;bottom:12%;animation-delay:1.1s"></div>

  <section id="titleScreen" class="screen active">
    <div class="logo">
      <span class="small">オールみのわフェスタ</span>
      <span class="main">チアゲーム</span>
      <span class="sub">★ タップで最高点！ ★</span>
    </div>
    <div class="catch">ジャンプのいちばん高いところをねらおう！</div>
    <div id="titleChars" class="titleChars"></div>
    <div class="menu">
      <button class="diff easy" data-diff="easy">かんたん<span>まずはここから！</span></button>
      <button class="diff normal" data-diff="normal">ふつう<span>ちょっとワチャワチャ</span></button>
      <button class="diff hard" data-diff="hard">むずかしい<span>4人全員ジャンプも！</span></button>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="gameTop">
      <div id="scoreBadge" class="badge">SCORE 0</div>
      <div id="roundBadge" class="badge">1 / 8</div>
    </div>
    <div class="instruction">ジャンプの頂点でタップ！（ジャンプごとに1回)</div>
    <div id="stage" class="stage"></div>
    <div id="tapPulse" class="tapPulse"></div>
  </section>

  <section id="resultScreen" class="screen">
    <div class="resultTitle">おつかれさま！</div>
    <div class="totalLabel">TOTAL</div>
    <div id="totalScore" class="totalScore">0 / 800</div>
    <div id="rank" class="rank">もう一回チャレンジ！</div>
    <div class="stats">
      <div class="stat"><span>PERFECT</span><b id="perfectCount">× 0</b></div>
      <div class="stat"><span>GREAT</span><b id="greatCount">× 0</b></div>
      <div class="stat"><span>GOOD</span><b id="goodCount">× 0</b></div>
      <div class="stat"><span>NICE</span><b id="niceCount">× 0</b></div>
      <div class="stat"><span>MISS</span><b id="missCount">× 0</b></div>
    </div>
    <div class="resultButtons">
      <button id="againBtn" class="resultBtn">もう一度あそぶ</button>
      <button id="titleBtn" class="resultBtn secondary">タイトルへ</button>
    </div>
  </section>
</div>

  const $ = id => document.getElementById(id);
  const titleScreen = $("titleScreen");
  const gameScreen = $("gameScreen");
  const resultScreen = $("resultScreen");
  const titleChars = $("titleChars");
  const stage = $("stage");
  const tapPulse = $("tapPulse");

  let audioCtx = null;
  let difficulty = "easy";
  let score = 0;
  let round = 0;
  let counts = {perfect:0,great:0,good:0,nice:0,miss:0};
  let currentEvent = null;
  let eventTimer = null;
  let missTimers = [];
  let totalJumps = 0;
  let running = false;
  let raf = 0;

  const settings = {
    easy:   {min:1,max:2, twoChance:.22, minDur:920,maxDur:1120, stagger:110,minH:.55,maxH:.72},
    normal: {min:1,max:3, twoChance:.70, minDur:760,maxDur:980,  stagger:145,minH:.58,maxH:.76},
    hard:   {min:2,max:4, twoChance:1,    minDur:610,maxDur:830,  stagger:180,minH:.60,maxH:.80}
  };

  // The 4 illustrations are cropped tight to each character's silhouette, but
  // their poses have very different arm/leg spread, so the raw images have
  // different width:height ratios. Since they're all fit into an equally
  // sized box by width, a "wide" pose (arms out) ends up rendered much
  // taller-relative or shorter-relative than a "narrow" pose. These base
  // factors scale every character down to match the naturally smallest one;
  // on top of that, title/game screens each have their own manual tweaks.
  const BASE_SCALE = [0.77, 1.00, 0.81, 0.57];

  // Title screen: leftmost bigger, 2nd-from-left smaller (but bumped back up
  // one size per follow-up feedback), rightmost bigger.
  const TITLE_CHAR_SCALE = [
    BASE_SCALE[0]*1.15,
    BASE_SCALE[1]*0.70*1.15,
    BASE_SCALE[2],
    BASE_SCALE[3]*1.30
  ];

  // In-game: both edge characters (slot0, slot3) bigger.
  const GAME_CHAR_SCALE = [
    BASE_SCALE[0]*1.15,
    BASE_SCALE[1],
    BASE_SCALE[2],
    BASE_SCALE[3]*1.15
  ];

  function makeImg(src, scale=1) {
    const wrap = document.createElement("div");
    wrap.className = "charScale";
    wrap.style.transform = `scale(${scale})`;
    const img = document.createElement("img");
    img.src = src;
    img.draggable = false;
    wrap.appendChild(img);
    return wrap;
  }

  function buildTitle() {
    titleChars.innerHTML = "";
    SPRITES.forEach((src,i) => {
      const box = document.createElement("div");
      box.className = "titleChar";
      const idleWrap = document.createElement("div");
      idleWrap.className = "idleWrap";
      idleWrap.appendChild(makeImg(src, TITLE_CHAR_SCALE[i]));
      box.appendChild(idleWrap);
      titleChars.appendChild(box);
    });
  }

  function showScreen(screen) {
    [titleScreen,gameScreen,resultScreen].forEach(s => s.classList.remove("active"));
    screen.classList.add("active");
  }

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function tone(freq, duration, type="sine", volume=.045, slide=0) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(freq, now);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, now + duration);
    g.gain.setValueAtTime(volume, now);
    g.gain.exponentialRampToValueAtTime(.001, now + duration);
    o.connect(g).connect(audioCtx.destination);
    o.start(now); o.stop(now + duration + .02);
  }

  function soundJump(){ tone(230,.12,"triangle",.045,130); }
  function soundTap(){ tone(720,.055,"square",.035,-160); }
  function soundGreat(){
    tone(587,.09,"sine",.05,50);
    setTimeout(()=>tone(740,.13,"sine",.048,50),70);
  }
  function soundGood(){

  function soundPerfect(){

    setTimeout(()=>tone(659,.13,"sine",.05,90),55);
    setTimeout(()=>tone(784,.20,"sine",.055,100),105);

  function soundMiss(){

  function chooseCount(cfg) {
    if (difficulty === "easy") return Math.random() < cfg.twoChance ? 2 : 1;
    return cfg.min + Math.floor(Math.random() * (cfg.max - cfg.min + 1));
  }

  function randomUnique(n) {
    const a=[0,1,2,3];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a.slice(0,n);
  }

  function makeEvent() {
    const cfg = settings[difficulty];
    const count = chooseCount(cfg);
    const ids = randomUnique(count);
    const now = performance.now();
    const baseStagger = cfg.stagger * (0.45 + Math.random()*.65);

    currentEvent = {
      jumps: ids.map((id,i) => {
        const duration = cfg.minDur + Math.random()*(cfg.maxDur-cfg.minDur);
        return {
          id,
          start: now + 180 + i*baseStagger + Math.random()*45,
          duration,
          height: cfg.minH + Math.random()*(cfg.maxH-cfg.minH),
          resolved: false
        };
      }),
      end: 0
    };
    currentEvent.end = Math.max(...currentEvent.jumps.map(j => j.start+j.duration));
    currentEvent.jumps.forEach(() => soundJump());
    totalJumps += currentEvent.jumps.length;

    // Fallback timer per jump so every jump always gets resolved even if
    // requestAnimationFrame gets paused by the browser (tab switched away,
    // screen locked, etc). Without this, the game could hang forever since
    // the quick miss-check normally only runs inside the animation frame loop.
    missTimers.forEach(t => clearTimeout(t));
    missTimers = currentEvent.jumps.map(j => setTimeout(() => {
      if (running && currentEvent && currentEvent.jumps.includes(j) && !j.resolved) {
        resolveJumpJudge(j, "miss", null, true);
      }
    }, Math.max(0, (j.start + j.duration) - now) + 200));
  }

  function setCharSlots() {
    stage.innerHTML = "";
    SPRITES.forEach((src,i) => {
      const slot = document.createElement("div");
      slot.className = "charSlot slot"+i;
      slot.dataset.id = i;
      slot.appendChild(makeImg(src, GAME_CHAR_SCALE[i]));
      stage.appendChild(slot);
    });
  }

  function jumpOffset(j, now) {
    const p = (now - j.start) / j.duration;
    if (p <= 0) return 0;
    if (p >= 1) return 0;
    return Math.sin(Math.PI * p) * j.height * stage.clientHeight * .34;
  }

  function updateFrame(now) {
    if (!running) return;
    const slots = stage.querySelectorAll(".charSlot");

    slots.forEach((slot,i) => {
      let y=0, tilt=0;
      if (currentEvent) {
        const j = currentEvent.jumps.find(x=>x.id===i);
        if (j) {
          y = jumpOffset(j,now);
          if (y > 1) {
            const p=(now-j.start)/j.duration;
            tilt = Math.sin(p*Math.PI*2)*3;
          }
        }
      }
      slot.style.transform = `translate3d(0,${-y}px,0) rotate(${tilt}deg)`;
    });

    if (currentEvent) {
      currentEvent.jumps.forEach(j => {
        if (!j.resolved && now > j.start + j.duration + 160) {
          resolveJumpJudge(j, "miss", null, true);
        }
      });
    }
    raf = requestAnimationFrame(updateFrame);
  }

  function nextRound() {
    if (!running) return;
    if (round >= 8) {
      finishGame();
      return;
    }
    round++;
    $("roundBadge").textContent = `${round} / 8`;
    makeEvent();
  }

  function slotCenterPct(id) {
    return id * 25 + 12.5;
  }

  function showJumpJudge(jump, kind) {
    const el = document.createElement("div");
    el.className = "judge show" + (kind === "perfect" ? " perfect" : "");
    el.style.left = slotCenterPct(jump.id) + "%";
    el.textContent = {
      perfect:"PERFECT!!",
      great:"GREAT!",
      good:"GOOD!",
      nice:"NICE!",
      miss:"MISS..."
    }[kind];
    gameScreen.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  function resolveJumpJudge(jump, kind) {
    if (!currentEvent || jump.resolved) return;
    jump.resolved = true;

    const points = {perfect:100,great:80,good:60,nice:30,miss:0}[kind];
    score += points;
    counts[kind]++;
    $("scoreBadge").textContent = `SCORE ${score}`;

    showJumpJudge(jump, kind);

    tapPulse.style.left = slotCenterPct(jump.id) + "%";
    tapPulse.classList.remove("show");
    void tapPulse.offsetWidth;
    tapPulse.classList.add("show");

    if (kind === "perfect") {
      soundPerfect();
      confetti(jump.id);
    } else if (kind === "great") {
      soundGreat();
    } else if (kind === "good") {
      soundGood();
    } else if (kind === "nice") {
      soundNice();
    } else {
      soundMiss();
    }

    checkRoundComplete();
  }

  function checkRoundComplete() {
    if (!currentEvent) return;
    if (!currentEvent.jumps.every(j => j.resolved)) return;
    clearTimeout(eventTimer);
    eventTimer = setTimeout(nextRound, 550);
  }

  function handleTap(e) {
    if (!running || !currentEvent) return;

    const now = performance.now();
    let best = null;
    currentEvent.jumps.forEach(j => {
      if (j.resolved) return;
      const apex = j.start + j.duration/2;
      const diff = Math.abs(now-apex);
      if (!best || diff < best.diff) best = {j,diff};
    });
    if (!best) return;
    e.preventDefault();

    const sec = best.diff/1000;
    let kind = "miss";
    if (sec <= .05) kind="perfect";
    else if (sec <= .10) kind="great";
    else if (sec <= .20) kind="good";
    else if (sec <= .35) kind="nice";

    resolveJumpJudge(best.j, kind);
  }

  function confetti(id) {
    const centerX = typeof id === "number" ? slotCenterPct(id) : 50;
    const colors = ["","blue","gold"];
    for(let i=0;i<26;i++){
      const p=document.createElement("div");
      p.className="particle "+colors[i%3];
      p.style.left=(centerX+(Math.random()*16-8))+"%";
      p.style.top=(28+Math.random()*18)+"%";
      p.style.setProperty("--dx",(Math.random()*300-150)+"px");
      p.style.setProperty("--dy",(120+Math.random()*260)+"px");
      p.style.animation=`confetti ${.75+Math.random()*.65}s cubic-bezier(.15,.7,.3,1) forwards`;
      p.style.transform=`rotate(${Math.random()*180}deg)`;
      gameScreen.appendChild(p);
      setTimeout(()=>p.remove(),1500);
    }
  }

  function startGame(diff) {
    ensureAudio();
    difficulty=diff;
    score=0; round=0; totalJumps=0;
    counts={perfect:0,great:0,good:0,nice:0,miss:0};
    currentEvent=null;
    clearTimeout(eventTimer);
    missTimers.forEach(t => clearTimeout(t));
    missTimers = [];
    cancelAnimationFrame(raf);
    running=true;
    $("scoreBadge").textContent="SCORE 0";
    $("roundBadge").textContent="1 / 8";
    showScreen(gameScreen);
    setCharSlots();
    nextRound();
    raf=requestAnimationFrame(updateFrame);
  }

  function finishGame() {
    running=false;
    cancelAnimationFrame(raf);
    clearTimeout(eventTimer);
    missTimers.forEach(t => clearTimeout(t));
    missTimers = [];
    currentEvent=null;
    const maxScore = totalJumps * 100;
    $("totalScore").textContent=`${score} / ${maxScore}`;
    $("perfectCount").textContent=`× ${counts.perfect}`;
    $("greatCount").textContent=`× ${counts.great}`;
    $("goodCount").textContent=`× ${counts.good}`;
    $("niceCount").textContent=`× ${counts.nice}`;
    $("missCount").textContent=`× ${counts.miss}`;

    const rate = maxScore > 0 ? score/maxScore : 0;
    let rankText, rankSound;
    if (rate >= .90) { rankText="チアマスター！"; rankSound=soundRankTop; }
    else if (rate >= .75) { rankText="すごい！"; rankSound=soundRankGreat; }
    else if (rate >= .50) { rankText="ナイス！"; rankSound=soundRankNice; }
    else { rankText="もう一回チャレンジ！"; rankSound=soundRankRetry; }
    $("rank").textContent = rankText;
    rankSound();

    showScreen(resultScreen);
  }

  document.querySelectorAll(".diff").forEach(btn=>{
    btn.addEventListener("pointerdown",e=>{
      e.preventDefault();
      startGame(btn.dataset.diff);
    });
  });

  gameScreen.addEventListener("pointerdown",handleTap,{passive:false});

  $("againBtn").addEventListener("pointerdown",e=>{
    e.preventDefault();
    startGame(difficulty);
  });
  $("titleBtn").addEventListener("pointerdown",e=>{
    e.preventDefault();
    running=false;
    cancelAnimationFrame(raf);
    clearTimeout(eventTimer);
    missTimers.forEach(t => clearTimeout(t));
    missTimers = [];
    showScreen(titleScreen);
    buildTitle();
  });

  buildTitle();
})();
</script>
</body>
</html>
